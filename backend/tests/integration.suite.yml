# Codeception Test Suite Configuration
#
# Интеграционные / смок-тесты: реальные внешние вызовы (сеть). Ключи/конфиг — через env.
# Yii2 БЕЗ orm — приложение бутстрапится (нужен автолоадер app\ через @app), но БД не трогаем.
# Регулярный прогон их не трогает (отдельный сьют + skip без ключа).
# RUN `build` COMMAND AFTER ADDING/REMOVING MODULES.

actor: IntegrationTester
modules:
    enabled:
      - Asserts
      - Yii2:
            part: [email]
