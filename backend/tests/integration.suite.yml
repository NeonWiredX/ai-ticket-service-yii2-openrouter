# Codeception Test Suite Configuration
#
# Интеграционные: реальные зависимости — БД (orm) и/или внешние вызовы (сеть, ключи через env).
# DB-тесты идут в транзакции с откатом (cleanup); сетевые смоки скипаются без ключа.
# RUN `build` COMMAND AFTER ADDING/REMOVING MODULES.

actor: IntegrationTester
modules:
    enabled:
      - Asserts
      - Yii2:
            part: [orm]
