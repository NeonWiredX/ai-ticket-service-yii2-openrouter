; Dev-оверрайды PHP. Монтируется в conf.d, грузится последним (zz-).
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
memory_limit = 512M

upload_max_filesize = 32M
post_max_size = 32M

; В dev opcache перечитывает изменённые файлы, чтобы правки подхватывались сразу.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
